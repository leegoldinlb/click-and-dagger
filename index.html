<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CLICK &amp; DAGGER</title>
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>
<div id="game">
  <div id="viewwrap">
    <canvas id="view" width="640" height="360"></canvas>
    <div id="message"></div>
    <div id="overlay">
      <img class="splashart" src="assets/ui/splash.png?v=1" alt="CLICK AND DAGGER">
      <p class="tag" id="customtag" style="display:none">&#9656; CUSTOM MISSION LOADED &#9666;</p>
      <p class="tag" id="episodetag" style="display:none">&#9656; MISSION &#9666;</p>
      <button id="startbtn">[ BEGIN MISSION ]</button>
      <a id="editorlink" href="editor.html">LAIR ARCHITECT &mdash; BUILD YOUR OWN MISSION</a>
      <p id="enginecredit">Built on the DUMM engine</p>
    </div>
    <!-- Touch controls: shown only on coarse-pointer devices (see body.touch in
         style.css / the isTouch check in main.js). Every button below just
         calls the exact same function the matching keyboard/mouse input
         already calls — no separate mobile game logic. -->
    <div id="touchlook"></div>
    <div id="touchdpad">
      <button id="tdUp" class="tdbtn tdup" aria-label="Move forward">&#9650;</button>
      <button id="tdDown" class="tdbtn tddown" aria-label="Move back">&#9660;</button>
      <button id="tdLeft" class="tdbtn tdleft" aria-label="Strafe left">&#9664;</button>
      <button id="tdRight" class="tdbtn tdright" aria-label="Strafe right">&#9654;</button>
    </div>
    <div id="touchkit">
      <button id="tKitPrev" aria-label="Previous weapon">&#9664;</button>
      <button id="tKitOk" aria-label="Select kit item">&#10003;</button>
      <button id="tKitNext" aria-label="Next weapon">&#9654;</button>
    </div>
    <div id="touchactions">
      <button id="tLook" aria-label="Look">LOOK</button>
      <button id="tMode" aria-label="Draw or holster">DRAW</button>
      <button id="tFire" aria-label="Fire or interact">&#9679;</button>
    </div>
    <!-- HUD/mode line live inside #viewwrap (not as siblings of it) so that in
         fullscreen, where they float as an absolute overlay, "position:
         absolute" anchors to the actual letterboxed game picture (viewwrap's
         own box) instead of the full 100vh fullscreen viewport — otherwise
         they'd float inside whatever black letterbox gap sits below the
         picture rather than over the picture itself. -->
    <div id="hud">
      <div id="stats">
        <span class="stat">HP <b id="hp">100</b></span>
        <span class="stat"><b id="weapon">WALTHER PPK</b> AMMO <b id="ammo">24</b></span>
        <span class="stat">COVER <b id="cover">UNDERCOVER</b></span>
      </div>
      <div id="inventory"><span id="invempty">FIELD KIT: EMPTY</span></div>
    </div>
    <div id="modeline">COMBAT MODE — TAB or F to holster · right-click to LOOK</div>
  </div>
  <a id="editlink" href="editor.html" title="Open this level in LAIR ARCHITECT to edit it">&#9998; EDIT THIS LEVEL</a>
  <button id="fullscreenbtn" title="Toggle fullscreen (V)">⛶ FULLSCREEN</button>
</div>
<script src="js/audio.js?v=8"></script>
<script src="js/music.js?v=5"></script>
<script src="js/missions.js?v=26"></script>
<script src="js/world.js?v=163"></script>
<script src="js/engine.js?v=86"></script>
<script src="js/adventure.js?v=51"></script>
<script src="js/main.js?v=75"></script>
</body>
</html>
